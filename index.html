
   <!--in this we learn inline and internal css style-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>  
    <!--internal style tag-->
    <style>
        p{
            color: deeppink;
        }
        .salam{
            font-weight: 100px;
            color: aqua;
        }
    </style>                                                                   
</head>
<body>

    <!--inline  style tag-->
   
    <p style="color:red;"> you have to do practice</p> 
         <p style="font-style: italic;">you have to do practice</p> 
    <p>you have to do practice</p>
    <p>you have to do practice</p>
    
    <p>you have to do practice</p>
    <strong class="salam" >assalamualikum</strong>
</body>
</html>
